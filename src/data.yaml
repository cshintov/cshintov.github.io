    accent: sglang
    tags: "CUDA · GB10"
    date: "Aug 2026"
    title: "New chip, new model, and a server that won't start."
    dek: "A stale hardware gate locked NVIDIA's GB10 (DGX Spark) out of SGLang's fast sparse-decode kernel and crashed the server on startup. The fix is one line."
