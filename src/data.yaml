# Merged upstream contributions. Each has a public writeup at /writeups/<slug>/.
oss:
  - project: "Erigon"
    pr: 22877
    url: "https://github.com/erigontech/erigon/pull/22877"
    writeup: "https://cshintov.github.io/writeups/erigon-estimategas-fix/"
    date: "2026"
    title: "Fix non-deterministic eth_estimateGas"
    text: "A watcher goroutine could cancel the shared EVM after its own probe finished, aborting the next probe with err == nil, so the gas binary search converged below the true minimum. Replaced it with context.AfterFunc plus a joined stop(); added a 200-call determinism test."
    stack: "Go · concurrency · EVM"
  - project: "SGLang"
    pr: 36649
    url: "https://github.com/sgl-project/sglang/pull/36649"
    writeup: "https://cshintov.github.io/writeups/sglang-sm121-sparse-decode/"
    date: "2026"
    title: "Enable trtllm-gen sparse decode on GB10 / DGX Spark"
    text: "The sparse-attention decode gate excluded sm_121, so GB10 fell to a fallback kernel that aborted at CUDA graph capture and the model could not serve. Widened the gate; verified on 2x DGX Spark serving Qwen3.8-Flash-Next."
    stack: "CUDA · PyTorch · inference"

projects:
  - { date: "2015",  title: "ezmarc.com", url: "https://www.ezmarc.com/", byline: "Python / Flask / MARC", text: "Co-designed and shipped as a fresher: a Python API converting book metadata into MARC library records." }
  - { date: "2025 →", title: "LLM-assisted internal tooling",        byline: "Claude Code skills, memory systems, ft bookmarks classifier", text: "Custom skills and memory persistence for a working developer; X/Twitter bookmarks classifier (<code>ft</code>) for personal knowledge management." }

