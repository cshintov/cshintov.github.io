@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..48,600;12..48,700;12..48,800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#faf8f4; --panel:#fffdf9; --panel-2:#f1ede4; --ink:#1a1c1e; --soft:#5c626b; --faint:#8b8f98;
  --line:#e5e0d5; --line-soft:#efebe1;
  --gold:#a8791f; --gold-2:#8a6216;
  --erigon:#d8501f; --sglang:#3a8f16;
  --shadow:0 1px 0 rgba(0,0,0,.02),0 14px 40px -26px rgba(40,30,10,.4);
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --disp:'Bricolage Grotesque','IBM Plex Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d0f12; --panel:#14171b; --panel-2:#1b1f25; --ink:#edeef0; --soft:#99a0aa; --faint:#6b727c;
    --line:#262a30; --line-soft:#1e2228;
    --gold:#e0b25a; --gold-2:#e0b25a;
    --erigon:#ff7a45; --sglang:#8fe23a;
    --shadow:0 0 0 1px rgba(255,255,255,.02),0 30px 60px -34px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --bg:#0d0f12; --panel:#14171b; --panel-2:#1b1f25; --ink:#edeef0; --soft:#99a0aa; --faint:#6b727c;
  --line:#262a30; --line-soft:#1e2228;
  --gold:#e0b25a; --gold-2:#e0b25a;
  --erigon:#ff7a45; --sglang:#8fe23a;
  --shadow:0 0 0 1px rgba(255,255,255,.02),0 30px 60px -34px rgba(0,0,0,.85);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:760px;margin:0 auto;padding:0 24px}

header.site{display:flex;justify-content:space-between;align-items:center;
  padding:26px 0 22px;position:sticky;top:0;z-index:10;
  background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line-soft)}
.brand{font-family:var(--disp);font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand .dot{color:var(--gold)}
nav.top{display:flex;gap:20px;font-family:var(--mono);font-size:13px;color:var(--soft)}
nav.top a{padding-bottom:2px;border-bottom:1.5px solid transparent;transition:border-color .15s,color .15s}
nav.top a:hover,nav.top a.on{color:var(--ink);border-bottom-color:var(--gold)}
@media(max-width:520px){nav.top{gap:14px;font-size:12px}}

.sec{padding:46px 0 8px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.sec-head h2{font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--soft);margin:0}
.sec-head .count{font-family:var(--mono);font-size:12px;color:var(--faint)}

/* writeup rows (shared by home feed and writeups index) */
.feed{display:flex;flex-direction:column}
.post{display:block;padding:26px 0 26px 22px;border-top:1px solid var(--line);position:relative;transition:padding-left .18s}
.post:first-child{border-top:0}
.post::before{content:"";position:absolute;left:0;top:30px;width:4px;height:0;border-radius:3px;background:var(--accent);transition:height .18s}
.post:hover{padding-left:30px}
.post:hover::before{height:calc(100% - 52px)}
.post .meta{font-family:var(--mono);font-size:12.5px;color:var(--faint);display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:11px}
.post .meta .chip{color:var(--accent);border:1px solid color-mix(in oklab,var(--accent) 40%,var(--line));border-radius:5px;padding:2px 8px;letter-spacing:.02em}
.post .meta .sep{color:var(--line)}
.post h3{font-family:var(--disp);font-weight:700;letter-spacing:-.015em;line-height:1.08;font-size:clamp(24px,4.4vw,32px);margin:0 0 9px;text-wrap:balance;transition:color .15s}
.post:hover h3{color:var(--accent)}
.post .dek{color:var(--soft);font-size:16.5px;max-width:60ch;margin:0}
.post .dek code{font-family:var(--mono);font-size:.9em}
.post .go{font-family:var(--mono);font-size:12.5px;color:var(--faint);margin-top:13px;display:inline-flex;gap:7px;align-items:center}
.post:hover .go{color:var(--accent)}

footer.site{margin-top:44px;padding:30px 0 60px;border-top:1px solid var(--line-soft);
  font-family:var(--mono);font-size:12.5px;color:var(--faint);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
footer.site a{color:var(--soft)} footer.site a:hover{color:var(--gold)}

.toggle{position:fixed;top:16px;right:16px;z-index:20;width:36px;height:36px;border-radius:50%;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font-size:15px;box-shadow:var(--shadow)}
.toggle:hover{border-color:var(--gold)}
@media(max-width:520px){.toggle{display:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}html,body{height:100%}
body{display:flex;flex-direction:column}
.wrap.top{flex:0 0 auto;width:100%}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0 14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{appearance:none;background:var(--panel);border:1px solid var(--line);color:var(--ink);
  padding:7px 15px;border-radius:999px;font-family:var(--mono);font-size:12.5px;cursor:pointer;transition:all .15s}
.tabs button:hover{border-color:var(--gold)}
.tabs button.active{background:var(--gold);border-color:var(--gold);color:#141414;font-weight:600}
.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.actions a{font-family:var(--mono);font-size:12px;color:var(--soft);padding:7px 12px;border:1px solid var(--line);border-radius:999px;white-space:nowrap;transition:all .15s}
.actions a:hover{color:var(--ink);border-color:var(--gold)}
.hint{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
main{flex:1 1 auto;position:relative;min-height:70vh;border-top:1px solid var(--line)}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
iframe.active{display:block}
@media(max-width:520px){.actions{margin-left:0}.hint{display:none}}

<main>
<iframe id="f-engineering-brief" src="/variants/engineering-brief.html?v=1787848782" class="active" title="Blockchain"></iframe>
<iframe id="f-engineering-brief-platform" data-src="/variants/engineering-brief-platform.html?v=1787848782" title="Platform / SRE"></iframe>
</main>

<script>
  const allTabs = document.querySelectorAll('nav.tabs button');
  const frames = document.querySelectorAll('main iframe');
  const openTab = document.getElementById('open-tab');
  function activate(src) {
    const bareKey = src.replace(/\?.*$/, '').replace('/variants/', '').replace('.html', '');
    allTabs.forEach(b => b.classList.toggle('active', b.dataset.src === src));
    frames.forEach(fr => {
      const want = (fr.id === 'f-' + bareKey);
      if (want && !fr.src) fr.src = fr.dataset.src || src;
      fr.classList.toggle('active', want);
    });
    openTab.href = src;
    history.replaceState(null, '', '#' + bareKey);
  }
  allTabs.forEach(b => b.addEventListener('click', () => activate(b.dataset.src)));
  window.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const i = parseInt(e.key, 10);
    if (i >= 1 && i <= allTabs.length) { e.preventDefault(); activate(allTabs[i-1].dataset.src); }
  });
  const hash = location.hash.replace('#','');
  if (hash) { const m = Array.from(allTabs).find(b => b.dataset.src.includes(hash)); if (m) activate(m.dataset.src); }
</script>
<footer class="site">
  <span>Kerala, India · remote</span>

</footer>
<script>
(function(){
  var b=document.getElementById('themeBtn'),root=document.documentElement;
  if(!b)return;
  function cur(){var t=root.getAttribute('data-theme');return t||((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');}
  b.addEventListener('click',function(){root.setAttribute('data-theme',cur()==='dark'?'light':'dark');});
})();
</script>
